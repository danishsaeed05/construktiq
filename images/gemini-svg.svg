<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EBEBEB; }
      .orange { fill: #FF5500; }
      .dark { fill: #1A1A1A; }
      .text { font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="bg" />

  <g id="logo-group">
    <!-- Orange Roof Peak -->
    <path class="orange" d="
      M 250, 42 
      L 380, 117 
      L 380, 175 
      L 250, 102 
      L 120, 175 
      L 120, 117 
      Z" />

    <!-- Dark C / House Silhouette -->
    <path class="dark" d="
      M 250, 120 
      L 380, 195 
      L 320, 230 
      L 250, 190 
      L 175, 232 
      L 175, 292 
      L 250, 335 
      L 320, 295 
      L 380, 330 
      L 250, 405 
      L 120, 330 
      L 120, 195 
      Z" />

    <!-- 4-Pane Window Grid -->
    <!-- Top-Left Pane -->
    <rect class="orange" x="223" y="212" width="22" height="22" rx="2" />
    <!-- Top-Right Pane -->
    <rect class="orange" x="255" y="212" width="22" height="22" rx="2" />
    <!-- Bottom-Left Pane -->
    <rect class="orange" x="223" y="244" width="22" height="22" rx="2" />
    <!-- Bottom-Right Pane -->
    <rect class="orange" x="255" y="244" width="22" height="22" rx="2" />

    <!-- CONSTRUKTIQ Logotype - Fully within visible canvas -->
    <text x="250" y="458" class="dark text" font-size="35" text-anchor="middle">CONSTRUKTIQ</text>
  </g>
</svg>
